<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jed's Portfolio</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- Spline 3D Viewer Script -->
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.54/build/spline-viewer.js"></script>
    
    <!-- Vite Entry CSS/JS -->
    <link rel="stylesheet" href="./style.css">
  </head>
  <body class="bg-background text-white font-sans antialiased overflow-x-hidden">
    
    <!-- Spline 3D Background -->
    <div class="spline-container fixed inset-0 w-full h-full -z-10">
      <spline-viewer url="USER_URL_HERE" events-target="global"></spline-viewer>
    </div>

    <!-- Main Content Wrapper with Glassmorphism -->
    <main class="relative min-h-screen flex items-center justify-center p-6 pointer-events-none">
      
      <!-- Glassmorphism Hero Card -->
      <div class="bg-surface backdrop-blur-xl border border-surfaceBorder rounded-3xl p-10 md:p-16 shadow-2xl max-w-3xl w-full text-center pointer-events-auto transition-transform duration-500 hover:scale-[1.02]">
        
        <p class="text-sm md:text-base font-semibold tracking-widest uppercase text-gray-400 mb-4">Hello, World</p>
        
        <h1 class="text-5xl md:text-7xl font-extrabold mb-6 tracking-tight bg-clip-text text-transparent bg-gradient-to-br from-white to-gray-500">
          I'm Jed.
        </h1>
        
        <p class="text-lg md:text-xl text-gray-300 font-light mb-10 leading-relaxed max-w-2xl mx-auto">
          Crafting high-end digital experiences through creative development and interactive 3D design.
        </p>

        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
          <a href="#" class="px-8 py-4 bg-white text-black font-semibold rounded-full hover:bg-gray-200 transition-colors shadow-lg shadow-white/10">
            View Projects
          </a>
          <a href="#" class="px-8 py-4 bg-surface border border-surfaceBorder text-white font-semibold rounded-full hover:bg-white/10 transition-colors">
            Get in Touch
          </a>
        </div>

      </div>

    </main>
    
    <script type="module" src="./main.js"></script>
  </body>
</html>
